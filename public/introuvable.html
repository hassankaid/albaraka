<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page introuvable</title>
    <style>
      :root {
        --ink: #0a0908;
        --gold: #c9a04e;
        --gold-bright: #e4c57a;
        --cream: #f5f1e6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--ink);
        background-image:
          radial-gradient(60% 45% at 50% 0%, rgba(201, 160, 78, 0.1), transparent 70%),
          radial-gradient(50% 40% at 50% 100%, rgba(201, 160, 78, 0.06), transparent 70%);
        color: var(--cream);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 460px; text-align: center; }
      .mark {
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 28px;
      }
      .rule {
        width: 44px;
        height: 1px;
        margin: 0 auto 28px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.3;
        margin: 0 0 14px;
        color: var(--gold-bright);
      }
      p {
        font-size: 15px;
        line-height: 1.65;
        margin: 0;
        color: rgba(245, 241, 230, 0.66);
      }
      @media (max-width: 480px) {
        h1 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">Al Baraka</p>
      <div class="rule"></div>
      <h1>Cette page n'existe pas</h1>
      <p>Le lien que vous avez suivi est incorrect ou n'est plus actif.</p>
    </main>
  </body>
</html>
